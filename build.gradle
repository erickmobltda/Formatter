/*
 * Build file for the SpockStep contribution.
 *
 * This mirrors the structure used by Spotless' own lib/ sub-project.
 * To integrate into the real Spotless repo, the source files move into
 * lib/src/main/java/... and test files into lib/src/test/java/...
 */
plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
}

group = 'com.diffplug.spotless'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    // Spotless lib — the same version you target for the PR
    compileOnly 'com.diffplug.spotless:spotless-lib:2.43.0'

    // Test dependencies (mirrors Spotless' own test setup)
    testImplementation 'com.diffplug.spotless:spotless-lib:2.43.0'
    testImplementation 'com.diffplug.spotless:spotless-testlib:2.43.0'
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}

// Fat JAR containing only SpockFormatter (no Spotless deps needed at runtime)
shadowJar {
    archiveBaseName = 'spock-formatter'
    archiveClassifier = ''
    archiveVersion = project.version
    manifest {
        attributes 'Main-Class': 'com.diffplug.spotless.groovy.SpockFormatterCli'
    }
    // Exclude the Spotless API classes — SpockFormatter has zero external deps
    configurations = [project.configurations.runtimeClasspath]
    // Only include our own classes (SpockFormatter has no runtime deps)
    include 'com/diffplug/spotless/groovy/SpockFormatter*.class'
    include 'com/diffplug/spotless/groovy/SpockFormatterCli*.class'
    // Include inner classes
    include 'com/diffplug/spotless/groovy/SpockFormatter$*.class'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.diffplug.spotless'
            artifactId = 'spotless-spock-formatter'
            version = project.version
        }
    }
    repositories {
        mavenLocal()
    }
}
